<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Solingo — self-hosted, Duolingo-style script trainer. Engine + JSON courses.">
<title>Solingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230a84ff%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2736%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3Eあ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="home">
  <div class="hud"><div><span class="ic">🔥</span><div><b id="h-streak">0</b><span>연속일</span></div></div><div><span class="ic">⚡️</span><div><b id="h-xp">0</b><span>XP</span></div></div><div><span class="ic">✍️</span><div><b id="h-known">0</b><span>익힌 글자</span></div></div></div>
  <button class="start" id="start">학습 시작하기<small id="start-sub"></small></button>
  <div id="sets"></div>
  <div class="section-t">단어 <span id="w-pct"></span></div><div class="words" id="wordlist"></div>
  <p class="tiny" style="margin-top:20px">기록은 이 브라우저에만 남습니다. <button id="snd-reset" style="color:var(--accent)">소리 설정 다시</button></p>
</div>

<div class="sheet" id="perm"><div class="panel">
  <h2>소리와 진동을 켤까요?</h2>
  <p>브라우저 규칙상 한 번은 직접 허용해야 소리가 자동으로 나옵니다.</p>
  <ul><li><span class="ic">🔊</span>새 글자와 단어를 일본어 음성으로 자동 재생</li><li><span class="ic">🎵</span>정답·오답 효과음</li><li><span class="ic">📳</span>정답 시 진동 (지원 기기만)</li></ul>
  <button class="primary" id="perm-ok">허용하고 시작</button>
  <button class="ghost" id="perm-no" style="width:100%;margin-top:8px">소리 없이</button>
  <p class="tiny" id="perm-note" style="margin:10px 0 0;text-align:center"></p>
</div></div>

<div id="lesson">
  <div class="top"><button class="x" id="l-x">✕</button><div class="meter"><i id="l-meter"></i></div><span class="combo" id="l-combo"></span></div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="l-foot"><div class="verdict" id="l-verdict"></div><button class="primary" id="l-btn">확인</button></div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
